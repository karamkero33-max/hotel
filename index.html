<!DOCTYPE html>

<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(#111,#333);
    color:white;
    text-align:center;
    margin:0;
    padding:20px;
}

h1{
    color:gold;
}

.container{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:30px;
}

.card{
    background:#222;
    width:230px;
    padding:20px;
    border-radius:20px;
}

.card img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
}

select,button{
    padding:10px;
    border:none;
    border-radius:10px;
    margin-top:10px;
}

button{
    background:green;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:30px;
}
</style>
</head>
