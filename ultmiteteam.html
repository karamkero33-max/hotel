    // --- 1. SOUND EFFECTS SYNTHESIZER (Web Audio API) ---
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTap() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch (e) {}
      }
      playCoinChime() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.06);
            gain.gain.setValueAtTime(0.12, now + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.06);
            osc.stop(now + idx * 0.06 + 0.2);
          });
        } catch (e) {}
      }
      playPackOpenBoom() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const subOsc = this.ctx.createOscillator();
          const subGain = this.ctx.createGain();
          subOsc.type = 'sine';
          subOsc.frequency.setValueAtTime(150, now);
          subOsc.frequency.exponentialRampToValueAtTime(30, now + 0.8);
          subGain.gain.setValueAtTime(0.3, now);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
          subOsc.connect(subGain);
          subGain.connect(this.ctx.destination);
          subOsc.start(now);
          subOsc.stop(now + 0.8);
        } catch (e) {}
      }
      playIconFanfare() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const chords = [
            [261.63, 329.63, 392.00],
            [349.23, 440.00, 523.25],
            [392.00, 493.88, 587.33],
            [523.25, 659.25, 783.99, 1046.50]
          ];
          chords.forEach((chord, cIdx) => {
            const startTime = now + cIdx * 0.25;
            const duration = cIdx === chords.length - 1 ? 1.2 : 0.22;
            chord.forEach((freq) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, startTime);
              gain.gain.setValueAtTime(0.15, startTime);
              gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(startTime);
              osc.stop(startTime + duration);
            });
          });
        } catch (e) {}
      }
      playCardFlip() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(1200, now + 0.12);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } catch (e) {}
      }
    }

    // --- 5. PLAYER CARD COMPONENT ---
    function PlayerCard({ player, size = 'md', onClick, showNewBadge = false, selected = false }) {
      const sizeClasses = {
        sm: 'w-24 h-36 text-[9px] rounded-lg border',
        md: 'w-36 h-56 text-[11px] rounded-xl border-2',
        lg: 'w-48 h-72 text-xs rounded-2xl border-2',
        xl: 'w-64 h-96 text-sm rounded-3xl border-4',
      }[size];

      const getTierTheme = () => {
        switch (player.tier) {
          case 'Bronze': return { bg: 'bg-gradient-to-b from-amber-800 via-amber-900 to-amber-950 text-amber-100 border-amber-600/60', header: 'bg-amber-950/80 border-amber-600/40' };
          case 'Silver': return { bg: 'bg-gradient-to-b from-slate-400 via-slate-600 to-slate-900 text-slate-100 border-slate-300/60', header: 'bg-slate-900/80 border-slate-400/40' };
          case 'Gold': return { bg: 'bg-gradient-to-b from-amber-300 via-yellow-500 to-amber-800 text-amber-950 border-amber-300', header: 'bg-amber-950/30 border-amber-300/40 text-amber-100' };
          case 'Rare Gold': return { bg: 'bg-gradient-to-br from-yellow-300 via-amber-400 to-amber-700 text-amber-950 border-yellow-200', header: 'bg-amber-950/40 border-yellow-300/60 text-yellow-100' };

      return (

          <div className="text-[9px] text-center font-semibold opacity-75 truncate px-1 pb-1">

    // --- 6. MAIN APP COMPONENT ---
    function App() {
      const [coins, setCoins] = useState(() => {
        const saved = localStorage.getItem('ut_coins_v1');
        return saved ? parseInt(saved, 10) : 100000;
      });

      const [club, setClub] = useState(() => {
        const saved = localStorage.getItem('ut_club_v1');
        return saved ? JSON.parse(saved) : {
          'yashin-icon': 1, 'saliba-rare': 1, 'cubarsi-silver': 1, 'theo-rare': 1,
          'hakimi-gold': 1, 'modric-rare': 1, 'mainoo-silver': 1, 'pedri-rare': 1,
          'endrick-silver': 1, 'guler-silver': 1, 'rashford-gold': 1
        };
      });

      const [squad, setSquad] = useState(() => {
        const saved = localStorage.getItem('ut_squad_v1');
        return saved ? JSON.parse(saved) : {
          gk: 'yashin-icon', lb: 'theo-rare', cb1: 'saliba-rare', cb2: 'cubarsi-silver',
          rb: 'hakimi-gold', cm1: 'modric-rare', cdm: 'mainoo-silver', cm2: 'pedri-rare',
          lw: 'rashford-gold', st: 'endrick-silver', rw: 'guler-silver'
        };
      });

      const [activeTab, setActiveTab] = useState('home');
      const [activePackOpening, setActivePackOpening] = useState(null);
      const [activeSlotId, setActiveSlotId] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');

      useEffect(() => { localStorage.setItem('ut_coins_v1', coins.toString()); }, [coins]);
      useEffect(() => { localStorage.setItem('ut_club_v1', JSON.stringify(club)); }, [club]);
      useEffect(() => { localStorage.setItem('ut_squad_v1', JSON.stringify(squad)); }, [squad]);

      const handleOpenPack = (pack) => {
        if (coins < pack.price) return;
        soundFx.playTap();
        setCoins(prev => prev - pack.price);

        const drawn = [];
        const tiers = Object.keys(pack.probabilities);
        for (let i = 0; i < pack.cardCount; i++) {
          const rand = Math.random() * 100;
          let cumulative = 0;
          let selectedTier = tiers[0];
          for (const tier of tiers) {
            cumulative += pack.probabilities[tier];
            if (rand <= cumulative) {
              selectedTier = tier;
              break;
            }
          }
          const pool = PLAYERS_DATABASE.filter(p => p.tier === selectedTier);
          const chosen = pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : PLAYERS_DATABASE[0];
          drawn.push(chosen);
        }

        soundFx.playPackOpenBoom();
        setActivePackOpening({ pack, drawnPlayers: drawn, currentIndex: 0, showSummary: false });
      };

      const finishPackOpening = (keptPlayers, soldAmount) => {
        setCoins(prev => prev + soldAmount);
        setClub(prev => {
          const next = { ...prev };
          keptPlayers.forEach(p => {
            next[p.id] = (next[p.id] || 0) + 1;
          });
          return next;
        });
        setActivePackOpening(null);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* HEADER */}
          <header className="sticky top-0 z-40 bg-neutral-950/90 backdrop-blur border-b border-neutral-800 p-4">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-400 p-0.5">
                  <div className="w-full h-full bg-neutral-950 rounded-[10px] flex items-center justify-center font-black text-amber-400">
                    UT
                  </div>
                </div>
                <div>
                  <h1 className="font-extrabold text-lg text-amber-400">ULTIMATE TEAM FC</h1>
                  <p className="text-[10px] text-neutral-400">فريق الأساطير • 2026</p>
                </div>
              </div>

              {/* NAV TABS */}
              <nav className="flex gap-2 bg-neutral-900 p-1.5 rounded-2xl border border-neutral-800">
                <button onClick={() => { soundFx.playTap(); setActiveTab('home'); }} className={`px-4 py-2 rounded-xl text-xs font-bold ${activeTab === 'home' ? 'bg-amber-400 text-neutral-950' : 'text-neutral-300'}`}>
                  الرئيسية 🏠
                </button>
                <button onClick={() => { soundFx.playTap(); setActiveTab('packs'); }} className={`px-4 py-2 rounded-xl text-xs font-bold ${activeTab === 'packs' ? 'bg-amber-400 text-neutral-950' : 'text-neutral-300'}`}>
                  فتح الباكات 📦
                </button>
                <button onClick={() => { soundFx.playTap(); setActiveTab('squad'); }} className={`px-4 py-2 rounded-xl text-xs font-bold ${activeTab === 'squad' ? 'bg-amber-400 text-neutral-950' : 'text-neutral-300'}`}>
                  التشكيلة ⚽
                </button>
                <button onClick={() => { soundFx.playTap(); setActiveTab('collection'); }} className={`px-4 py-2 rounded-xl text-xs font-bold ${activeTab === 'collection' ? 'bg-amber-400 text-neutral-950' : 'text-neutral-300'}`}>
                  المجموعة 📚
                </button>
              </nav>

              {/* COINS BALANCE */}
              <div className="flex items-center gap-2 bg-amber-950/80 border border-amber-500/50 px-4 py-2 rounded-xl">
                <span className="text-yellow-400 text-lg">🪙</span>
                <span className="font-black text-yellow-300 text-sm">{coins.toLocaleString()} Coins</span>
              </div>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            {activeTab === 'home' && (
              <div className="space-y-8 text-center py-12">
                <div className="bg-gradient-to-r from-amber-600 to-purple-950 p-12 rounded-3xl border border-amber-400/30 shadow-2xl">
                  <h1 className="text-4xl md:text-6xl font-black text-white mb-4">
                    ابنِ فريق الأحلام وافتح الباكات! 🌟
                  </h1>
                  <p className="text-neutral-300 max-w-2xl mx-auto text-sm mb-6">
                    جمع أساطير كرة القدم، كوّن التشكيلة التكتيكية بالملعب، واجمع ملايين الـ Coins في أكبر تجربة Ultimate Team!
                  </p>
                  <div className="flex justify-center gap-4">
                    <button onClick={() => setActiveTab('packs')} className="px-8 py-4 bg-amber-400 text-neutral-950 font-black rounded-2xl text-sm shadow-lg">
                      فتح الباكات الآن 📦
                    </button>
                    <button onClick={() => setActiveTab('squad')} className="px-8 py-4 bg-neutral-900 text-white font-bold rounded-2xl border border-neutral-700 text-sm">
                      عرض التشكيلة ⚽
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* PACK STORE */}
            {activeTab === 'packs' && (
              <div className="space-y-6">
                <h2 className="text-3xl font-extrabold text-amber-400">متجر الباكات 📦</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

                    <div key={pack.id} className={`bg-gradient-to-b ${pack.bgGradient} p-5 rounded-3xl border border-white/10 flex flex-col justify-between shadow-xl`}>

                        <div className="text-4xl mb-2">⚡</div>
                        <h3 className="font-black text-lg text-white">{pack.arabicName}</h3>
                        <p className="text-xs text-neutral-300 mt-1">{pack.arabicDescription}</p>
                      </div>
                      <button
                        disabled={coins < pack.price}
                        onClick={() => handleOpenPack(pack)}
                        className={`w-full py-3 rounded-2xl font-black text-sm shadow-lg ${
                          coins >= pack.price ? 'bg-amber-400 text-neutral-950 hover:brightness-110' : 'bg-neutral-800 text-neutral-500 cursor-not-allowed'
                        }`}
                      >
                        فتح بـ {pack.price.toLocaleString()} 🪙
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* SQUAD BUILDER */}
            {activeTab === 'squad' && (
              <div className="space-y-6">
                <h2 className="text-3xl font-extrabold text-amber-400">التشكيلة والملعب ⚽</h2>
                <div className="relative w-full aspect-[4/3] bg-emerald-900 rounded-3xl overflow-hidden border-4 border-emerald-950 shadow-2xl p-4">
                  <div className="absolute inset-0 bg-gradient-to-b from-emerald-800 to-emerald-950" />
                  {FORMATIONS[0].slots.map(slot => {
                    const playerId = squad[slot.id];
                    const player = PLAYERS_DATABASE.find(p => p.id === playerId);
                    return (
                      <div
                        key={slot.id}
                        onClick={() => setActiveSlotId(slot.id)}
                        className="absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer"
                        style={{ top: `${slot.top}%`, left: `${slot.left}%` }}
                      >
                        {player ? (
                          <PlayerCard player={player} size="sm" />
                        ) : (
                          <div className="w-16 h-24 rounded-xl bg-black/40 border-2 border-dashed border-white/40 flex flex-col items-center justify-center text-xs font-bold text-amber-300">
                            {slot.position}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* COLLECTION */}
            {activeTab === 'collection' && (
              <div className="space-y-6">
                <h2 className="text-3xl font-extrabold text-amber-400">المجموعة والكروت 📚</h2>
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                  {PLAYERS_DATABASE.map(player => {
                    const count = club[player.id] || 0;
                    return (
                      <div key={player.id} className={`flex flex-col items-center ${count === 0 ? 'opacity-30 grayscale' : ''}`}>
                        <PlayerCard player={player} size="sm" />
                        {count > 1 && <span className="text-xs font-bold text-amber-300 mt-1">x{count} نسخة</span>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {/* PACK OPENING MODAL */}
          {activePackOpening && (
            <div className="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-6 text-center">
              <h2 className="text-3xl font-black text-amber-400 mb-6">مبروك! حصلت على الكروت التالية 🎉</h2>
              <div className="flex flex-wrap justify-center gap-4 mb-8">
                {activePackOpening.drawnPlayers.map((player, idx) => (
                  <PlayerCard key={idx} player={player} size="md" showNewBadge />
                ))}
              </div>
              <button
                onClick={() => finishPackOpening(activePackOpening.drawnPlayers, 0)}
                className="py-4 px-8 bg-emerald-500 text-white font-black rounded-2xl text-sm"
              >
                حفظ الكروت في النادي
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
