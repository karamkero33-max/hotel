<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مين المختلف؟</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:#fff;
    background:
      radial-gradient(circle at 15% 20%,#263b80 0,transparent 35%),
      radial-gradient(circle at 85% 80%,#702060 0,transparent 40%),
      linear-gradient(135deg,#070b18,#10152b,#080b17);
    display:flex;justify-content:center;align-items:center;padding:25px;
}
main{width:100%;max-width:1050px;text-align:center}
h1{font-size:52px;margin:0 0 12px;text-shadow:0 0 25px #00eaff}
h2{font-size:30px}
p{font-size:20px}
.screen{display:none}
.screen.active{display:block}
.names{
    display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:35px 0
}
.input-card{
    background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);
    border-radius:22px;padding:25px
}
input{
    width:100%;padding:16px;border:0;border-radius:14px;
    font-size:20px;text-align:center;outline:none
}
button{
    border:0;border-radius:16px;padding:16px 30px;font-size:21px;
    font-weight:bold;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#0077ff,#7b2cff);
    box-shadow:0 8px 25px rgba(0,150,255,.3);transition:.2s
}
button:hover{transform:scale(1.04)}
.secondary{background:rgba(255,255,255,.12)}
.secret-box{
    max-width:600px;margin:35px auto;padding:50px 25px;
    min-height:260px;border-radius:28px;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.2);
    display:flex;flex-direction:column;justify-content:center;align-items:center
}
.secret{
    font-size:48px;font-weight:bold;margin:25px 0;
    text-shadow:0 0 20px rgba(255,255,255,.4)
}
.hide-secret{display:none}
.guess{
    display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:35px 0
}
.guess button{min-height:120px}
.result{font-size:30px;font-weight:bold;min-height:55px}
.correct{border:3px solid #00ff88!important;background:rgba(0,255,130,.18)!important}
.wrong{border:3px solid #ff304f!important;background:rgba(255,0,50,.18)!important}
@media(max-width:700px){
    h1{font-size:38px}
    .names,.guess{grid-template-columns:1fr}
    .secret{font-size:38px}
}
</style>
</head>
<body>
<main>

<section id="setup" class="screen active">
    <h1>🕵️ مين المختلف؟</h1>
    <p>اكتب أسماء اللاعبين الثلاثة، وبعدها كل لاعب هيشوف الكارت السري بتاعه لوحده.</p>
    <section class="names">
        <article class="input-card">
            <h2>👤 اللاعب الأول</h2>
            <input id="player1" placeholder="اكتب الاسم">
        </article>
        <article class="input-card">
            <h2>👤 اللاعب الثاني</h2>
            <input id="player2" placeholder="اكتب الاسم">
        </article>
        <article class="input-card">
            <h2>👤 اللاعب الثالث</h2>
            <input id="player3" placeholder="اكتب الاسم">
        </article>
    </section>
    <button onclick="startGame()">🎮 ابدأ اللعبة</button>
</section>

<section id="pass" class="screen">
    <h1>🔒 كارت سري</h1>
    <p id="passText"></p>
    <button onclick="showSecret()">👁️ اضغط لإظهار الكارت</button>
</section>

<section id="secretScreen" class="screen">
    <h1>🤫 الكارت السري</h1>
    <p id="secretPlayer"></p>
    <section class="secret-box">
        <div id="secretValue" class="secret">؟؟؟</div>
        <button onclick="hideSecret()">🙈 إخفاء الكارت</button>
    </section>
</section>

<section id="guessScreen" class="screen">
    <h1>🔥 مين المختلف؟</h1>
    <p>اختار اللاعب اللي معاه الاسم المختلف</p>
    <section class="guess">
        <button id="guess0" onclick="guess(0)"></button>
        <button id="guess1" onclick="guess(1)"></button>
        <button id="guess2" onclick="guess(2)"></button>
    </section>
    <div id="result" class="result"></div>
    <br>
    <button id="newRound" class="secondary" onclick="newRound()">🔄 جولة جديدة</button>
</section>

</main>

<script>
const family = [
"عمو جميل","عمو جمال","رامي","ايفي","كرم","ابرام","عمو وليم",
"جدو فرج","تيته ام وليم","مايكل","مارك","ميرولا","هبه","مرثا",
"تيته ايفون","خالو اسامه","طنط مرفت","جدو اسكندر","جدو كرم",
"ميشيل","طنط زوزو","طنط ميشيل","طنط فيفي"
];

let players=[];
let cards=[];
let current=0;
let oddIndex=0;
let gameLocked=false;

function show(id){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function shuffle(a){
    return [...a].sort(()=>Math.random()-0.5);
}

function startGame(){
    players=[
        document.getElementById("player1").value.trim(),
        document.getElementById("player2").value.trim(),
        document.getElementById("player3").value.trim()
    ];
    if(players.some(x=>!x)){
        alert("اكتب أسماء اللاعبين الثلاثة الأول.");
        return;
    }

    const picked=shuffle(family);
    const same=picked[0];
    const different=picked[1];

    cards=shuffle([same,same,different]);
    oddIndex=cards.indexOf(different);
    current=0;
    gameLocked=false;

    preparePass();
}

function preparePass(){
    show("pass");
    document.getElementById("passText").innerHTML =
        "مرر الجهاز إلى <b>"+players[current]+"</b><br><br>وخلي باقي اللاعبين مايبصوش 👀";
}

function showSecret(){
    show("secretScreen");
    document.getElementById("secretPlayer").textContent =
        "الكارت الخاص بـ "+players[current];
    document.getElementById("secretValue").textContent=cards[current];
}

function hideSecret(){
    current++;
    if(current<3){
        preparePass();
    }else{
        showGuess();
    }
}

function showGuess(){
    show("guessScreen");
    for(let i=0;i<3;i++){
        const b=document.getElementById("guess"+i);
        b.textContent=players[i];
        b.classList.remove("correct","wrong");
        b.disabled=false;
    }
    document.getElementById("result").textContent="";
    document.getElementById("newRound").style.display="none";
}

function guess(index){
    if(gameLocked)return;
    gameLocked=true;

    if(index===oddIndex){
        document.getElementById("guess"+index).classList.add("correct");
        document.getElementById("result").textContent="🎉 صح! "+players[index]+" هو المختلف!";
    }else{
        document.getElementById("guess"+index).classList.add("wrong");
        document.getElementById("guess"+oddIndex).classList.add("correct");
        document.getElementById("result").textContent=
            "❌ غلط! المختلف هو "+players[oddIndex]+"!";
    }

    document.getElementById("newRound").style.display="inline-block";
}

function newRound(){
    const picked=shuffle(family);
    const same=picked[0];
    const different=picked[1];
    cards=shuffle([same,same,different]);
    oddIndex=cards.indexOf(different);
    current=0;
    gameLocked=false;
    preparePass();
}
</script>
</body>
</html>
