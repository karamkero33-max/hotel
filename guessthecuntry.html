<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌍 خمن اسم الدولة - لعبة الألغاز والرموز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card-bg: #111827;
      --card-border: #1f2937;
      --amber: #f59e0b;
      --emerald: #10b981;
      --rose: #f43f5e;
      --text: #f9fafb;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, #030712 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      user-select: none;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      text-align: center;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .badge {
      background: rgba(245, 158, 11, 0.15);
      color: var(--amber);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #1f2937;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(to left, var(--amber), #fbbf24);
      transition: width 0.3s ease;
    }
    .clues-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .clue-card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 20px;
      padding: 16px;
      min-width: 130px;
      flex: 1;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
    }
    .clue-emoji { font-size: 56px; margin-bottom: 8px; display: block; }
    .clue-label { font-size: 18px; font-weight: 800; color: var(--amber); }
    .clue-sub { font-size: 11px; color: var(--text-muted); background: #111827; padding: 2px 8px; border-radius: 999px; display: inline-block; margin-top: 4px; }
    .plus-symbol { font-size: 28px; font-weight: 900; color: var(--amber); }
    .input-box {
      width: 100%;
      padding: 14px 20px;
      font-size: 20px;
      font-weight: 800;
      font-family: inherit;
      border-radius: 16px;
      border: 2px solid #374151;
      background: #030712;
      color: #fff;
      text-align: center;
      outline: none;
      transition: all 0.2s;
      margin-bottom: 12px;
    }
    .input-box:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,0.2); }
    .btn {
      width: 100%;
      padding: 14px 24px;
      font-size: 18px;
      font-weight: 800;
      font-family: inherit;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--amber), #d97706); color: #030712; }
    .btn-primary:hover { opacity: 0.95; transform: translateY(-2px); }
    .btn-success { background: linear-gradient(135deg, var(--emerald), #059669); color: #fff; }
    .feedback-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
    }
    .feedback-correct { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--emerald); color: #6ee7b7; }
    .feedback-wrong { background: rgba(244, 63, 94, 0.15); border: 1px solid var(--rose); color: #fda4af; }
    .shake { animation: shake 0.4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- شاشة البداية -->
    <div id="start-screen">
      <div style="font-size: 64px; margin-bottom: 12px;">🌍</div>
      <h1 style="font-size: 32px; font-weight: 900; margin-bottom: 8px;">🌍 خمن اسم الدولة</h1>
      <p style="color: var(--text-muted); margin-bottom: 24px; font-size: 16px;">
        ادمج معاني ونطق الصور والرموز لاكتشاف أسماء 50 دولة مختلفة!
      </p>
      <button class="btn btn-primary" onclick="startGame()">ابدأ اللعبة</button>
    </div>

    <!-- شاشة اللعب -->
    <div id="play-screen" class="hidden">
      <div class="header-bar">
        <span class="badge" id="q-counter">السؤال 1 من 50</span>
        <span class="badge" id="score-counter">0 نقطة</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width: 2%;"></div>
      </div>
      
      <div class="clues-wrapper" id="clues-container"></div>

      <form onsubmit="checkAnswer(event)">
        <input type="text" id="answer-input" class="input-box" placeholder="اكتب اسم الدولة هنا..." autocomplete="off">
        <button type="submit" id="btn-check" class="btn btn-primary">تحقق من الإجابة</button>
        <button type="button" id="btn-next" class="btn btn-success hidden" onclick="nextQuestion()">السؤال التالي ⬅️</button>
      </form>

      <div id="feedback-area"></div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="result-screen" class="hidden">
      <div style="font-size: 64px; margin-bottom: 12px;">🏆</div>
      <h2 style="font-size: 28px; font-weight: 900; margin-bottom: 8px;">انتهت اللعبة! 🎉</h2>
      <p style="color: var(--text-muted); margin-bottom: 20px;">شكراً للعبك لعبة خمن اسم الدولة!</p>
      <div style="display: flex; gap: 12px; margin-bottom: 24px;">
        <div class="clue-card">
          <div style="font-size: 12px; color: var(--text-muted);">مجموع النقاط</div>
          <div id="final-score" style="font-size: 28px; font-weight: 900; color: var(--amber);">0</div>
        </div>
        <div class="clue-card">
          <div style="font-size: 12px; color: var(--text-muted);">إجابات صحيحة</div>
          <div id="final-correct" style="font-size: 28px; font-weight: 900; color: var(--emerald);">0</div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="startGame()">إعادة اللعب 🔄</button>
    </div>
  </div>

  <script>

    ];

    let currentIndex = 0;
    let score = 0;
    let correctCount = 0;

    function normalize(text) {
      if (!text) return '';
      return text.trim().toLowerCase()
        .replace(/[\u064B-\u065F\u0670]/g, '')
        .replace(/[أإآٱ]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/[^\u0600-\u06FFa-zA-Z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ').trim();
    }

    function isMatch(user, target, accepted = []) {
      const u = normalize(user);
      const all = [target, ...accepted];
      for (const t of all) {
        const normT = normalize(t);
        if (u === normT) return true;
        const stripAl = (s) => (s.startsWith('ال') && s.length > 3 ? s.slice(2) : s);
        if (stripAl(u) === stripAl(normT)) return true;
        if ('ال' + stripAl(u) === normT || stripAl(u) === 'ال' + normT) return true;
      }
      return false;
    }

    function startGame() {
      currentIndex = 0;
      score = 0;
      correctCount = 0;
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('play-screen').classList.remove('hidden');
      loadQuestion();
    }

    function loadQuestion() {
      const q = questions[currentIndex];
      document.getElementById('q-counter').innerText = 'السؤال ' + (currentIndex + 1) + ' من ' + questions.length;
      document.getElementById('score-counter').innerText = score + ' نقطة';
      document.getElementById('progress-fill').style.width = (((currentIndex + 1) / questions.length) * 100) + '%';
      
      const cluesHTML = q.clues.map((c, i) => `
        <div class="clue-card">
          <span class="clue-emoji">${c.emoji}</span>
          <div class="clue-label">${c.label}</div>
          ${c.subText ? `<div class="clue-sub">${c.subText}</div>` : ''}
        </div>
        ${i < q.clues.length - 1 ? '<div class="plus-symbol">+</div>' : ''}
      `).join('');

      document.getElementById('clues-container').innerHTML = cluesHTML;
      const input = document.getElementById('answer-input');
      input.value = '';
      input.disabled = false;
      input.focus();
      document.getElementById('btn-check').classList.remove('hidden');
      document.getElementById('btn-next').classList.add('hidden');
      document.getElementById('feedback-area').innerHTML = '';
    }

    function checkAnswer(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('answer-input');
      const val = input.value.trim();
      if (!val) return;

      const q = questions[currentIndex];
      if (isMatch(val, q.country, q.acceptedAnswers)) {
        score += 100;
        correctCount++;
        document.getElementById('score-counter').innerText = score + ' نقطة';
        input.disabled = true;
        document.getElementById('btn-check').classList.add('hidden');
        document.getElementById('btn-next').classList.remove('hidden');
        document.getElementById('feedback-area').innerHTML = `
          <div class="feedback-box feedback-correct">
            <div>إجابة صحيحة ✅</div>
            <div style="font-size: 20px; margin: 4px 0;">${q.flag} <strong>${q.country}</strong></div>
            <div style="font-size: 13px;">💡 ${q.explanation}</div>
          </div>
        `;
      } else {
        input.classList.add('shake');
        setTimeout(() => input.classList.remove('shake'), 400);
        document.getElementById('feedback-area').innerHTML = `
          <div class="feedback-box feedback-wrong">إجابة خاطئة ❌ حاول مرة أخرى!</div>
        `;
      }
    }

    function nextQuestion() {
      if (currentIndex + 1 < questions.length) {
        currentIndex++;
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('play-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      document.getElementById('final-score').innerText = score;
      document.getElementById('final-correct').innerText = correctCount + ' / ' + questions.length;
    }
  </script>
